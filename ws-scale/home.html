<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ws-scale</title>
  <style>
    body { font-family: ui-sans-serif, system-ui, sans-serif; margin: 2rem; background: #111; color: #eee; }
    #log { border: 1px solid #333; height: 320px; overflow-y: auto; padding: 12px; white-space: pre-wrap; background: #1a1a1a; }
    form { margin-top: 12px; display: flex; gap: 8px; }
    input { flex: 1; padding: 8px; background: #222; color: #eee; border: 1px solid #444; }
    button { padding: 8px 16px; }
    .meta { color: #888; font-size: 14px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <h1>Star topology chat</h1>
  <p class="meta">This tab talks to one server. Open another server port in a second tab to see Redis fan-out.</p>
  <div id="log"></div>
  <form id="form">
    <input id="msg" autocomplete="off" placeholder="message">
    <button type="submit">Send</button>
  </form>
  <script>
    const log = document.getElementById("log");
    function append(text) {
      log.textContent += text + "\n";
      log.scrollTop = log.scrollHeight;
    }
    const proto = location.protocol === "https:" ? "wss" : "ws";
    const ws = new WebSocket(proto + "://" + location.host + "/ws");
    ws.onopen = () => append("[connected to " + location.host + "]");
    ws.onclose = () => append("[disconnected]");
    ws.onmessage = (e) => append(e.data);
    document.getElementById("form").onsubmit = (e) => {
      e.preventDefault();
      const input = document.getElementById("msg");
      if (!input.value) return;
      ws.send(input.value);
      input.value = "";
    };
  </script>
</body>
</html>
